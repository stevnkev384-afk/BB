<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة خاصة</title><style>
body {
    background: #f5f0f5;
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}
.box {
    background: white;
    padding: 30px;
    margin: auto;
    width: 280px;
    border-radius: 15px;
}
input, button {
    padding: 12px;
    margin: 10px;
}
button {
    background: #8e44ad;
    color: white;
    border: none;
    cursor: pointer;
}
</style></head><body>
<div class="box">
    <h2>مرحباً بك ❤️</h2>
    <p>اكتب اسمك</p><input type="text" id="name" placeholder="اسمك">
<br>
<button onclick="checkName()">دخول</button>

<h3 id="message"></h3>

</div><script>
function checkName() {
    let name = document.getElementById("name").value.trim();

    if (name === "يحيى") {
        document.getElementById("message").innerText =
        "ماءءء";
    } else {
        document.getElementById("message").innerText =
        "عذراً، لا توجد رسالة لك.";
    }
}
</script></body>
</html>
